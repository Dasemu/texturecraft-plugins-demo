[package]
name = "texturecraft-engine"
description = "TextureCraft session, command registry, painting, baking and inspection"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
texturecraft-core = { workspace = true }
texturecraft-texel = { workspace = true }
texturecraft-geom = { workspace = true }
texturecraft-compose = { workspace = true }
texturecraft-paint = { workspace = true }
texturecraft-bake = { workspace = true }
texturecraft-formats = { workspace = true }
rayon = { workspace = true }
epaint_default_fonts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# WebAssembly command plug-ins (`plugin`), and bundles passed as base64 (`plugin.install {data}`).
craft-plugin = { workspace = true }
base64 = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
# Test plug-ins are written in WebAssembly text.
wat = "1.261"
image = { workspace = true }
zip = { workspace = true }
